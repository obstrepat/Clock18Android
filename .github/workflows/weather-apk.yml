name: Build mood-weather APK
on:
  push:
    branches: [mood-weather-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native Android APK
        run: gradle --no-daemon assembleDebug
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ehval-havasi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ehval-havasi-apk
          path: ehval-havasi.apk
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ehval-v0.1.0 ehval-havasi.apk --title "Ehval Havasi Android v0.1.0" --notes "Test APK: MET Norway weather, interactive home widget; 7 fully translated languages, 100 locale selections with fallback." --target mood-weather-android --latest=false
