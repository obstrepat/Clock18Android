name: Build Fokus Qalxani APK
on:
  push:
    branches: [focus-shield-android-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FokusQalxani-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK on this isolated branch
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/FokusQalxani-v1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/FokusQalxani-v1.apk
          git commit -m "Build downloadable Fokus Qalxani APK"
          git push
