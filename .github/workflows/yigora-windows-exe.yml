name: Build Yigora Local 1.2.0 Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [yigora-local-v1-2-0]
    paths:
      - 'yigora-windows-builder/**'
      - '.github/workflows/yigora-windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and Excel libraries
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 openpyxl==3.1.5 xlrd==2.0.2 pillow==11.3.0
      - name: Create monochrome Windows icon
        working-directory: yigora-windows-builder
        run: python make_icon.py
      - name: Build Yigora.exe with embedded Python and Excel support
        working-directory: yigora-windows-builder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Yigora --icon Yigora_1.0.0.ico --hidden-import openpyxl --hidden-import xlrd --collect-all openpyxl --collect-all xlrd Yigora_bootstrap.py
      - name: Smoke test bundled Python and Excel readers on Windows
        working-directory: yigora-windows-builder
        shell: pwsh
        run: |
          $stub = @'
          import pathlib, os, openpyxl, xlrd
          pathlib.Path(os.environ["TEMP"], "Yigora_EXE_Smoke_OK.txt").write_text("Excel readers OK", encoding="utf-8")
          '@
          Set-Content -Path dist/server.py -Value $stub -Encoding utf8
          $p=Start-Process -FilePath (Resolve-Path dist/Yigora.exe) -WorkingDirectory (Resolve-Path dist) -PassThru
          $marker=Join-Path $env:TEMP 'Yigora_EXE_Smoke_OK.txt'
          $found=$false
          for ($i=0; $i -lt 30; $i++) {
            if (Test-Path $marker) { $found=$true; break }
            Start-Sleep -Seconds 2
          }
          if (!$found) { throw "Bundled Excel readers were not executed; runtime did not create marker" }
          Get-Process Yigora -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item dist/server.py
      - name: Smoke-test built-in SQLite backup without Python on target
        working-directory: yigora-windows-builder
        shell: pwsh
        run: |
          $data=Join-Path $env:LOCALAPPDATA 'Yigora\data'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          python -c "import sqlite3,os; c=sqlite3.connect(os.path.join(os.environ['LOCALAPPDATA'],'Yigora','data','studio.sqlite3')); c.execute('create table if not exists test_backup (id integer)'); c.execute('insert into test_backup values (1)'); c.commit(); c.close()"
          $exe=(Resolve-Path dist/Yigora.exe).Path
          $proc=Start-Process -FilePath $exe -ArgumentList '--backup' -WorkingDirectory (Resolve-Path dist) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Yigora --backup failed with exit code $($proc.ExitCode)" }
          if (!(Test-Path (Join-Path $data 'SON_YEDEK.txt'))) { throw "Yigora backup result was not recorded" }
          $backup=(Get-Content (Join-Path $data 'SON_YEDEK.txt') -Raw).Trim()
          if (!(Test-Path $backup)) { throw "Backup file was not created" }
          python -c "import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); assert db.execute('select count(*) from test_backup').fetchone()[0]==1; db.close()" "$backup"
      - name: Verify the actual server import graph inside frozen EXE
        working-directory: yigora-windows-builder
        shell: pwsh
        run: |
          $stub=@'
          import base64,calendar,csv,datetime as dt,hashlib,hmac,io,ipaddress,json,os,pathlib,re,secrets,sqlite3,sys,threading,time,urllib.parse
          from http import HTTPStatus
          from http.cookies import SimpleCookie
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          from contextlib import contextmanager
          from wsgiref.handlers import format_date_time
          import openpyxl,xlrd
          from decimal import Decimal,InvalidOperation,ROUND_HALF_UP
          import xml.etree.ElementTree
          import ctypes
          import zipfile
          from collections import defaultdict
          from email.utils import formatdate
          from openpyxl import load_workbook,Workbook
          from xlrd import open_workbook
          pathlib.Path(os.environ["TEMP"],"Yigora_ActualImports_OK.txt").write_text("all imports loaded",encoding="utf-8")
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"Yigora HTTP OK")
          with ThreadingHTTPServer(("127.0.0.1", 18765),Handler) as httpd:
              httpd.handle_request()
          '@
          Set-Content dist/server.py -Value $stub -Encoding UTF8
          $marker=Join-Path $env:TEMP "Yigora_ActualImports_OK.txt"
          if (Test-Path $marker) {Remove-Item $marker}
          $proc=Start-Process -FilePath (Resolve-Path dist/Yigora.exe) -WorkingDirectory (Resolve-Path dist) -PassThru
          $ok=$false
          for($i=0;$i -lt 40;$i++){
            if(Test-Path $marker){$ok=$true;break}
            Start-Sleep -Seconds 1
          }
          if(!$ok){throw "Yigora frozen EXE failed to import actual server dependencies"}
          $response=Invoke-WebRequest -Uri "http://127.0.0.1:18765/" -UseBasicParsing -TimeoutSec 10
          if($response.Content -ne "Yigora HTTP OK"){throw "Yigora frozen EXE HTTP smoke test failed"}
          Get-Process Yigora -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item dist/server.py
      - name: Upload Yigora.exe
        uses: actions/upload-artifact@v4
        with:
          name: Yigora_1.2.0_Windows_EXE
          path: yigora-windows-builder/dist/Yigora.exe
          if-no-files-found: error
          retention-days: 30
