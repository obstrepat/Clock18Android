name: Yigora Cloud Android 1.1.0
on:
  workflow_dispatch:
  push:
    branches: [yigora-cloud-v1-1-0]
    paths:
      - 'cedvelstudio-mobile/android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build Android launcher
        working-directory: cedvelstudio-mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Yigora-Cloud-Mobile-1.1.0
          path: cedvelstudio-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30