name: Yigora Local 1.2.0 Android APK
on:
  workflow_dispatch:
  push:
    branches: [yigora-local-v1-2-0]
    paths:
      - 'cedvelstudio-mobile/android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build Yigora 1.2.0 APK
        working-directory: cedvelstudio-mobile/android
        run: gradle --no-daemon assembleDebug
      - name: Upload Yigora APK
        uses: actions/upload-artifact@v4
        with:
          name: Yigora-Mobile-1.2.0-APK
          path: cedvelstudio-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30